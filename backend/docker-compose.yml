services:
  postgres:
    image: postgres:16-alpine
    container_name: luxury_directory_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: luxury_directory
    ports:
      - "5433:5432"
    volumes:
      - luxury_directory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d luxury_directory"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  luxury_directory_postgres_data:
